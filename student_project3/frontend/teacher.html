<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老师管理 - 学生管理系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>学生管理系统</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="students.html">学生管理</a>
            <a href="class.html">班级管理</a>
            <a href="score.html">成绩管理</a>
            <a href="teacher.html" class="active">老师管理</a>
            <a href="employment.html">就业管理</a>
        </nav>
    </header>

    <main class="container">
        <h2 class="page-title">老师管理</h2>

        <div id="statsGrid" class="stats-grid"></div>

        <div class="card">
            <div class="search-bar">
                <input type="text" id="searchName" placeholder="老师姓名">
                <select id="searchGender">
                    <option value="">全部性别</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
                <button class="btn btn-primary" onclick="searchTeachers()">搜索</button>
                <button class="btn btn-success" onclick="showAddModal()">新增老师</button>
                <button class="btn btn-secondary" onclick="showDeletedModal()">查看已删除</button>
            </div>

            <table id="teacherTable">
                <thead>
                    <tr>
                        <th>老师ID</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>电话</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    <tr><td colspan="5" class="loading">加载中...</td></tr>
                </tbody>
            </table>

            <div class="pagination">
                <button id="prevPage" onclick="prevPage()">上一页</button>
                <span id="pageInfo">第 1 / 1 页，共 0 条</span>
                <button id="nextPage" onclick="nextPage()">下一页</button>
            </div>
        </div>
    </main>

    <div id="teacherModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">新增老师</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="teacherForm">
                <input type="hidden" id="teacherId">
                <div class="form-group">
                    <label>姓名 *</label>
                    <input type="text" id="teacherName" required minlength="2" maxlength="10">
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select id="gender">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>电话</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="deletedModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>已删除老师</h2>
                <button class="modal-close" onclick="closeDeletedModal()">&times;</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>老师ID</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="deletedTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = '/teacher';
        let currentPage = 1;
        let pageSize = 10;
        let total = 0;

        async function fetchAPI(url, options = {}) {
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                const result = await response.json();
                if (result.code !== 200) {
                    throw new Error(result.message || '请求失败');
                }
                return result.data;
            } catch (error) {
                showMessage(error.message, 'error');
                throw error;
            }
        }

        function showMessage(msg, type = 'success') {
            const existing = document.querySelector('.message');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        async function loadStats() {
            try {
                const data = await fetchAPI(`${API_BASE}/stats`);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <h3>老师总数</h3>
                        <div class="number">${data.total}</div>
                    </div>
                    <div class="stat-card success">
                        <h3>男老师</h3>
                        <div class="number">${data.male_count}</div>
                    </div>
                    <div class="stat-card warning">
                        <h3>女老师</h3>
                        <div class="number">${data.female_count}</div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('statsGrid').innerHTML = '<p style="color:red;">加载统计失败</p>';
            }
        }

        async function loadTeachers() {
            const name = document.getElementById('searchName').value;
            const gender = document.getElementById('searchGender').value;

            let url = `${API_BASE}/check?page=${currentPage}&page_size=${pageSize}`;
            if (name) url += `&teacher_name=${encodeURIComponent(name)}`;
            if (gender) url += `&gender=${encodeURIComponent(gender)}`;

            try {
                const data = await fetchAPI(url);
                total = data.total;
                renderTable(data.data);
                updatePagination();
            } catch (e) {
                document.getElementById('teacherTableBody').innerHTML = 
                    '<tr><td colspan="5" style="text-align:center;color:red;">加载失败</td></tr>';
            }
        }

        function searchTeachers() {
            currentPage = 1;
            loadTeachers();
        }

        function renderTable(teachers) {
            const tbody = document.getElementById('teacherTableBody');
            if (!teachers || teachers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = teachers.map(t => `
                <tr>
                    <td>${t.teacher_id}</td>
                    <td>${t.teacher_name}</td>
                    <td>${t.gender || ''}</td>
                    <td>${t.phone || ''}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-warning" onclick="editTeacher(${t.teacher_id})">编辑</button>
                            <button class="btn btn-danger" onclick="deleteTeacher(${t.teacher_id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function updatePagination() {
            const totalPages = Math.ceil(total / pageSize) || 1;
            document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页，共 ${total} 条`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadTeachers();
            }
        }

        function nextPage() {
            if (currentPage < Math.ceil(total / pageSize)) {
                currentPage++;
                loadTeachers();
            }
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = '新增老师';
            document.getElementById('teacherForm').reset();
            document.getElementById('teacherId').value = '';
            document.getElementById('teacherModal').classList.add('show');
        }

        async function editTeacher(id) {
            try {
                const data = await fetchAPI(`${API_BASE}/check/${id}`);
                document.getElementById('modalTitle').textContent = '编辑老师';
                document.getElementById('teacherId').value = data.teacher_id;
                document.getElementById('teacherName').value = data.teacher_name;
                document.getElementById('gender').value = data.gender || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('teacherModal').classList.add('show');
            } catch (e) {}
        }

        function closeModal() {
            document.getElementById('teacherModal').classList.remove('show');
        }

        document.getElementById('teacherForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('teacherId').value;
            const formData = {
                teacher_name: document.getElementById('teacherName').value,
                gender: document.getElementById('gender').value || null,
                phone: document.getElementById('phone').value || null
            };

            try {
                if (id) {
                    await fetchAPI(`${API_BASE}/update/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    showMessage('更新成功', 'success');
                } else {
                    await fetchAPI(`${API_BASE}/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    showMessage('添加成功', 'success');
                }
                closeModal();
                loadTeachers();
                loadStats();
            } catch (e) {}
        });

        async function deleteTeacher(id) {
            if (!confirm('确定要删除该老师吗？')) return;
            try {
                await fetchAPI(`${API_BASE}/delete/${id}`, { method: 'DELETE' });
                showMessage('删除成功', 'success');
                loadTeachers();
                loadStats();
            } catch (e) {}
        }

        async function showDeletedModal() {
            try {
                const data = await fetchAPI(`${API_BASE}/deleted?page=1&page_size=100`);
                const tbody = document.getElementById('deletedTableBody');
                if (!data.data || data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">暂无数据</td></tr>';
                } else {
                    tbody.innerHTML = data.data.map(t => `
                        <tr>
                            <td>${t.teacher_id}</td>
                            <td>${t.teacher_name}</td>
                            <td>${t.gender || ''}</td>
                            <td><button class="btn btn-success" onclick="restoreTeacher(${t.teacher_id})">恢复</button></td>
                        </tr>
                    `).join('');
                }
                document.getElementById('deletedModal').classList.add('show');
            } catch (e) {}
        }

        function closeDeletedModal() {
            document.getElementById('deletedModal').classList.remove('show');
        }

        async function restoreTeacher(id) {
            try {
                await fetchAPI(`${API_BASE}/restore/${id}`, { method: 'PUT' });
                showMessage('恢复成功', 'success');
                showDeletedModal();
                loadTeachers();
                loadStats();
            } catch (e) {}
        }

        loadTeachers();
        loadStats();
    </script>
</body>
</html>
